server.port=8080

# Reads the optional ".env" file in the project folder (see .env.example).
# No .env file = safe TEST MODE with a built-in temporary database.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:h2:mem:hope}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# create-drop = test mode only. For Supabase set DDL_AUTO=none in .env
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.open-in-view=false

# true = creates roles and a demo admin (admin@hope.com / admin123) in TEST MODE only
app.demo-data=${DEMO_DATA:true}

# ----- Forgot password -----
# Address of the website (used inside the reset link)
app.base-url=${APP_BASE_URL:http://localhost:8080}
# true = show the reset link on the page (TEST MODE). Use false when real email is set up.
app.show-reset-link=${SHOW_RESET_LINK:true}
app.mail-from=${MAIL_FROM:no-reply@hope-erp.local}

# ----- Google sign-in (see README) -----
google.client-id=${GOOGLE_CLIENT_ID:}
