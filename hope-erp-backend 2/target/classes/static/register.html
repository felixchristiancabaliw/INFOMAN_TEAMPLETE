<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - HOPE, Inc. ERP</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: black;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }

        .container {
            width: 410px;
            max-width: 100%;
            min-height: 660px;
            background: #f9dfff;
            border: 5px solid white;
            border-radius: 55px;
            padding: 15px 9px 25px;
            display: flex;
            flex-direction: column;
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading h1 {
            font-family: Georgia, serif;
            font-size: 30px;
            margin-bottom: 5px;
        }

        .heading p {
            font-size: 16px;
        }

        .name-fields {
            display: flex;
            gap: 17px;
            margin-bottom: 16px;
        }

        .field {
            flex: 1;
            min-width: 0;
            margin-bottom: 13px;
        }

        .field label {
            display: block;
            font-size: 16px;
            margin: 0 3px 6px;
        }

        .field input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #c5c5c5;
            border-radius: 30px;
            background: white;
            font-size: 16px;
        }

        .main-button {
            width: 100%;
            height: 40px;
            margin-top: 22px;
            background: #710080;
            color: white;
            border: 1px solid #a64bb0;
            border-radius: 8px;
            font-family: Georgia, serif;
            font-size: 18px;
            cursor: pointer;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 28px;
            margin: 22px 0 46px;
            font-family: Georgia, serif;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: black;
        }

        .google-button {
            width: 100%;
            height: 44px;
            background: white;
            border: 1px solid #c5c5c5;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-size: 17px;
            cursor: pointer;
        }

        .google-logo {
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 25px;
            color: #4285f4;
        }

        a {
            color: blue;
            text-decoration: none;
        }

        .bottom-text {
            margin-top: auto;
            padding-top: 60px;
            text-align: center;
            font-size: 13px;
        }

        .bottom-text a {
            font-family: Georgia, serif;
            margin-left: 2px;
        }

        @media (max-width: 420px) {
            .container {
                min-height: 660px;
            }

            .heading h1 {
                font-size: 27px;
            }

            .name-fields {
                gap: 12px;
            }
        }
    
        .message {
            margin: 0 0 14px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
        }

        .message.error { background: #fdecea; color: #b71c1c; }
        .message.success { background: #e8f5e9; color: #1b5e20; }
        .message a { word-break: break-all; }
    </style>
</head>

<body>

    <div class="container">

        <div class="heading">
            <h1>Create an account</h1>
            <p>Join Hope, Inc. ERP</p>
        </div>

        <div id="message" class="message" hidden></div>

        <form id="registerForm">

            <div class="name-fields">

                <div class="field">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" required>
                </div>

                <div class="field">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" required>
                </div>

            </div>

            <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password"
                    minlength="8" required>
            </div>

            <button type="submit" class="main-button">
                Register
            </button>

        </form>

        <div class="divider">or</div>

        <button type="button" class="google-button"
            onclick="googleSignIn()">
            <span class="google-logo">G</span>
            Continue with Google
        </button>

        <div class="bottom-text">
            Already have an account?
            <a href="signin.html">Sign In</a>
        </div>

    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="google-auth.js"></script>
    <script>
        function showMessage(text, ok) {
            const box = document.getElementById("message");
            box.textContent = text;
            box.className = "message " + (ok ? "success" : "error");
            box.hidden = false;
        }

        function googleSignIn() {
            startGoogleSignIn(showMessage);
        }

        document.getElementById("registerForm").addEventListener("submit",
            async function(event) {
                event.preventDefault();
                const button = document.querySelector(".main-button");
                button.disabled = true;

                try {
                    const response = await fetch("/api/register", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            firstName: document.getElementById("firstName").value,
                            lastName: document.getElementById("lastName").value,
                            email: document.getElementById("email").value,
                            password: document.getElementById("password").value
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showMessage(data.message + " Taking you to Sign In...", true);
                        setTimeout(function () {
                            window.location.href = "signin.html";
                        }, 1500);
                        return;
                    }
                    showMessage(data.message, false);
                } catch (error) {
                    showMessage("Cannot reach the server. Is the backend running?", false);
                }

                button.disabled = false;
            }
        );

        setupGoogle(showMessage);
    </script>

</body>
</html>
